version: '3.7'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      - postgres
      - minio
    environment:
      - SERVER_PORT= 8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contentfriendsdb
      - SPRING_DATASOURCE_USERNAME=contentfriends
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - minio_username=danilkha
      - minio_url=http://minio:9000
      - minio_password=donil0304
    ports:
      - "8080:8080"
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: "contentfriendsdb"
      POSTGRES_USER: "contentfriends"
      POSTGRES_PASSWORD: "admin"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  minio:
    image: minio/minio:latest
    command: server --console-address ":9001" /data/
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: danilkha
      MINIO_ROOT_PASSWORD: donil0304
    volumes:
      - minio-storage:/data
  pgadmin:
    image: dpage/pgadmin4:7
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
volumes:
  minio-storage:
  db-data:
  pgadmin-data: